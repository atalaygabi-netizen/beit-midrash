<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בית המדרש - לוח בקרה</title>
    
    <!-- טעינת ספריות Firebase גרסה 8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #displayArea {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 5px;
            font-size: 18px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>לוח בקרה - בית המדרש</h2>
        <p>סנכרון בזמן אמת בין הטלפון למחשב</p>

        <textarea id="statusInput" placeholder="הקלד כאן הודעה או עדכון..."></textarea>
        <button onclick="saveData()">שמור ועדכן ענן</button>

        <div id="displayArea">טוען נתונים מהענן...</div>
    </div>

    <script>
        // הגדרות החיבור לפרויקט Firebase שלך
        const firebaseConfig = {
            databaseURL: "https://beit-midrash-eec50-default-rtdb.firebaseio.com"
        };

        // אתחול Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const dbRef = db.ref('board_state');

        // שמירת נתונים ל-Firebase
        function saveData() {
            const textValue = document.getElementById('statusInput').value;
            dbRef.set({
                message: textValue,
                updatedAt: new Date().toLocaleTimeString('he-IL')
            }).then(() => {
                console.log("הנתונים נשמרו בהצלחה!");
            }).catch((error) => {
                console.error("שגיאה בשמירה:", error);
            });
        }

        // האזנה לשינויים בזמן אמת מהענן (מתעדכן אוטומטית בכל מכשיר)
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const displayDiv = document.getElementById('displayArea');
            
            if (data) {
                displayDiv.innerHTML = `<strong>עדכון אחרון:</strong> ${data.message || ''} <br><small style="color:gray;">עודכן בשעה: ${data.updatedAt || ''}</small>`;
                
                // עדכון שדה הקלט שלא יידרך אם הקלדת במקביל
                const inputField = document.getElementById('statusInput');
                if (document.activeElement !== inputField) {
                    inputField.value = data.message || '';
                }
            } else {
                displayDiv.innerHTML = "אין עדכונים כרגע במסד הנתונים.";
            }
        });
    </script>

</body>
</html>
